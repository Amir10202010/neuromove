<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="980" viewBox="0 0 1300 980" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<rect width="1300" height="980" fill="#ffffff"/>
<text x="40.0" y="52.0" font-size="28" fill="#212529" text-anchor="start" font-weight="bold">Пайка одного датчика GY-521</text>
<text x="40.0" y="84.0" font-size="16" fill="#495057" text-anchor="start" font-weight="normal">Модуль чипом вверх, рядом выводов от себя. Жилы входят сверху, паять снизу. USB от ноутбука отключён.</text>
<rect x="70" y="250" width="560" height="420" rx="14" fill="#1c6dd0" stroke="#174a8b" stroke-width="3"/>
<rect x="280.0" y="420.0" width="140" height="140" rx="8" fill="#212529"/>
<text x="350.0" y="495.0" font-size="16" fill="#f8f9fa" text-anchor="middle" font-weight="bold">MPU-6050</text>
<text x="350.0" y="648.0" font-size="14" fill="#e7f5ff" text-anchor="middle" font-weight="normal">сторона с чипом — к крышке корпуса</text>
<circle cx="110.0" cy="288" r="15" fill="#f1c232" stroke="#a37f00" stroke-width="2"/>
<circle cx="110.0" cy="288" r="6" fill="#174a8b"/>
<text x="110.0" y="328.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">INT</text>
<circle cx="178.6" cy="288" r="15" fill="#f1c232" stroke="#a37f00" stroke-width="2"/>
<circle cx="178.6" cy="288" r="6" fill="#174a8b"/>
<text x="178.6" y="328.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">AD0</text>
<circle cx="247.1" cy="288" r="15" fill="#f1c232" stroke="#a37f00" stroke-width="2"/>
<circle cx="247.1" cy="288" r="6" fill="#174a8b"/>
<text x="247.1" y="328.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">XCL</text>
<circle cx="315.7" cy="288" r="15" fill="#f1c232" stroke="#a37f00" stroke-width="2"/>
<circle cx="315.7" cy="288" r="6" fill="#174a8b"/>
<text x="315.7" y="328.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">XDA</text>
<circle cx="384.3" cy="288" r="15" fill="#f1c232" stroke="#a37f00" stroke-width="2"/>
<circle cx="384.3" cy="288" r="6" fill="#174a8b"/>
<text x="384.3" y="328.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">SDA</text>
<circle cx="452.9" cy="288" r="15" fill="#f1c232" stroke="#a37f00" stroke-width="2"/>
<circle cx="452.9" cy="288" r="6" fill="#174a8b"/>
<text x="452.9" y="328.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">SCL</text>
<circle cx="521.4" cy="288" r="15" fill="#f1c232" stroke="#a37f00" stroke-width="2"/>
<circle cx="521.4" cy="288" r="6" fill="#174a8b"/>
<text x="521.4" y="328.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">GND</text>
<circle cx="590.0" cy="288" r="15" fill="#f1c232" stroke="#a37f00" stroke-width="2"/>
<circle cx="590.0" cy="288" r="6" fill="#174a8b"/>
<text x="590.0" y="328.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">VCC</text>
<path d="M 384.3 284 L 384.3 142 Q 384.3 118 408.3 118 L 690.0 118" fill="none" stroke="#2f9e44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="714.0" y="124.0" font-size="16" fill="#2f9e44" text-anchor="start" font-weight="bold">зелёная жила → SDA</text>
<path d="M 452.9 284 L 452.9 174 Q 452.9 150 476.9 150 L 690.0 150" fill="none" stroke="#868e96" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="714.0" y="156.0" font-size="16" fill="#495057" text-anchor="start" font-weight="bold">белая жила → SCL</text>
<path d="M 521.4 284 L 521.4 206 Q 521.4 182 545.4 182 L 690.0 182" fill="none" stroke="#212529" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="714.0" y="188.0" font-size="16" fill="#212529" text-anchor="start" font-weight="bold">чёрная жила → GND</text>
<path d="M 590.0 284 L 590.0 238 Q 590.0 214 614.0 214 L 690.0 214" fill="none" stroke="#e03131" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="714.0" y="220.0" font-size="16" fill="#e03131" text-anchor="start" font-weight="bold">красная жила → VCC</text>
<rect x="682" y="104" width="22" height="124" rx="6" fill="#9aa1a9"/>
<text x="693.0" y="248.0" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">кабель</text>
<path d="M 178.6 284 C 178.6 254 521.4 254 517.4 282" fill="none" stroke="#f08c00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350.0" y="364.0" font-size="15" fill="#ffd8a8" text-anchor="middle" font-weight="bold">оранжевая — перемычка AD0 → GND; у «ПР» — AD0 → VCC</text>
<line x1="101.0" y1="279.0" x2="119.0" y2="297.0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<line x1="101.0" y1="297.0" x2="119.0" y2="279.0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<line x1="238.1" y1="279.0" x2="256.1" y2="297.0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<line x1="238.1" y1="297.0" x2="256.1" y2="279.0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<line x1="306.7" y1="279.0" x2="324.7" y2="297.0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<line x1="306.7" y1="297.0" x2="324.7" y2="279.0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text x="70.0" y="704.0" font-size="15" fill="#495057" text-anchor="start" font-weight="normal">INT, XCL, XDA — не подключать. Гребёнку не паять: плата должна лечь в корпус плоской.</text>
<text x="70.0" y="730.0" font-size="15" fill="#495057" text-anchor="start" font-weight="normal">Если на вашей плате порядок другой — верить надписям у отверстий, а не картинке.</text>
<text x="860.0" y="300.0" font-size="18" fill="#212529" text-anchor="start" font-weight="bold">Какой модуль — что паять</text>
<rect x="860" y="318" width="400" height="112" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
<text x="878.0" y="350.0" font-size="18" fill="#212529" text-anchor="start" font-weight="bold">П — плечо</text>
<text x="878.0" y="376.0" font-size="15" fill="#495057" text-anchor="start" font-weight="normal">кабель 60 см · шина 0, адрес 0x68</text>
<text x="878.0" y="402.0" font-size="16" fill="#c66900" text-anchor="start" font-weight="bold">AD0 → GND</text>
<text x="1242.0" y="350.0" font-size="14" fill="#2f9e44" text-anchor="end" font-weight="bold">в пятницу, первым</text>
<rect x="860" y="446" width="400" height="112" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
<text x="878.0" y="478.0" font-size="18" fill="#212529" text-anchor="start" font-weight="bold">ПР — предплечье</text>
<text x="878.0" y="504.0" font-size="15" fill="#495057" text-anchor="start" font-weight="normal">кабель 90 см · шина 0, адрес 0x69</text>
<text x="878.0" y="530.0" font-size="16" fill="#c66900" text-anchor="start" font-weight="bold">AD0 → VCC</text>
<text x="1242.0" y="478.0" font-size="14" fill="#2f9e44" text-anchor="end" font-weight="bold">в понедельник</text>
<rect x="860" y="574" width="400" height="112" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
<text x="878.0" y="606.0" font-size="18" fill="#212529" text-anchor="start" font-weight="bold">Г — грудь</text>
<text x="878.0" y="632.0" font-size="15" fill="#495057" text-anchor="start" font-weight="normal">кабель 50 см · шина 1, адрес 0x68</text>
<text x="878.0" y="658.0" font-size="16" fill="#c66900" text-anchor="start" font-weight="bold">AD0 → GND</text>
<text x="1242.0" y="606.0" font-size="14" fill="#2f9e44" text-anchor="end" font-weight="bold">в понедельник</text>
<text x="70.0" y="790.0" font-size="18" fill="#212529" text-anchor="start" font-weight="bold">Пайка в разрезе</text>
<rect x="70" y="850" width="300" height="22" fill="#1c6dd0"/>
<rect x="206" y="846" width="28" height="30" fill="#f1c232"/>
<path d="M 220 808 L 220 882" fill="none" stroke="#e03131" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 198 876 Q 220 902 242 876 Z" fill="#c0c5cc" stroke="#868e96" stroke-width="2"/>
<line x1="188.0" y1="893.0" x2="252.0" y2="893.0" stroke="#495057" stroke-width="2" stroke-linecap="round"/>
<text x="390.0" y="820.0" font-size="15" fill="#495057" text-anchor="start" font-weight="normal">жила входит сверху, со стороны чипа</text>
<text x="390.0" y="866.0" font-size="15" fill="#495057" text-anchor="start" font-weight="normal">плата</text>
<text x="390.0" y="900.0" font-size="15" fill="#495057" text-anchor="start" font-weight="normal">снизу — бугорок припоя, хвост откусить вровень:</text>
<text x="390.0" y="922.0" font-size="15" fill="#495057" text-anchor="start" font-weight="normal">плата должна лечь на скотч ровно</text>
<text x="860.0" y="724.0" font-size="18" fill="#212529" text-anchor="start" font-weight="bold">Каждая точка</text>
<text x="860.0" y="758.0" font-size="15" fill="#212529" text-anchor="start" font-weight="normal">1. Жало 330–350 °C: прижать к колечку и жиле,</text>
<text x="880.0" y="779.0" font-size="15" fill="#212529" text-anchor="start" font-weight="normal">1–2 с, подать припой, убрать. Дольше 4 с — нельзя.</text>
<text x="860.0" y="812.0" font-size="15" fill="#212529" text-anchor="start" font-weight="normal">2. Точка блестящая, припой затёк в отверстие.</text>
<text x="880.0" y="833.0" font-size="15" fill="#212529" text-anchor="start" font-weight="normal">Соседние не слиплись — особенно SDA и SCL.</text>
<text x="860.0" y="866.0" font-size="15" fill="#212529" text-anchor="start" font-weight="normal">3. Мультиметр: между VCC и GND — не 0 Ом;</text>
<text x="880.0" y="887.0" font-size="15" fill="#212529" text-anchor="start" font-weight="normal">каждая жила звонится до своего конца кабеля.</text>
<text x="860.0" y="920.0" font-size="15" fill="#212529" text-anchor="start" font-weight="normal">4. Подёргать кабель: жилы сидят.</text>
<text x="880.0" y="941.0" font-size="15" fill="#212529" text-anchor="start" font-weight="normal">Подписать модуль на обороте: П, ПР или Г.</text>
</svg>
