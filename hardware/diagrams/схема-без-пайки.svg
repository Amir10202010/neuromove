<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1000" viewBox="0 0 1300 1000" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<rect width="1300" height="1000" fill="#ffffff"/>
<text x="40.0" y="52.0" font-size="28" fill="#212529" text-anchor="start" font-weight="bold">Без пайки: три датчика через макетную плату</text>
<text x="40.0" y="84.0" font-size="15" fill="#495057" text-anchor="start" font-weight="normal">Провода мама-папа: «мама» — на штырёк датчика или платы ESP32, «папа» — в дырку макетной платы. USB отключён, пока собираешь.</text>
<rect x="380" y="150" width="400" height="560" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/>
<text x="580.0" y="140.0" font-size="15" fill="#495057" text-anchor="middle" font-weight="bold">макетная плата</text>
<line x1="400" y1="210" x2="760" y2="210" stroke="#e03131" stroke-width="3" opacity="0.35"/>
<text x="400.0" y="196.0" font-size="13" fill="#495057" text-anchor="start" font-weight="normal">длинная полоса «+» по краю — 3V3</text>
<line x1="400" y1="280" x2="760" y2="280" stroke="#212529" stroke-width="3" opacity="0.35"/>
<text x="400.0" y="266.0" font-size="13" fill="#495057" text-anchor="start" font-weight="normal">длинная полоса «−» по краю — GND</text>
<line x1="400" y1="390" x2="760" y2="390" stroke="#2f9e44" stroke-width="3" opacity="0.35"/>
<text x="400.0" y="376.0" font-size="13" fill="#495057" text-anchor="start" font-weight="normal">полоска из 5 дырок — D21, SDA шины 0</text>
<line x1="400" y1="460" x2="760" y2="460" stroke="#868e96" stroke-width="3" opacity="0.35"/>
<text x="400.0" y="446.0" font-size="13" fill="#495057" text-anchor="start" font-weight="normal">полоска из 5 дырок — D22, SCL шины 0</text>
<line x1="400" y1="570" x2="760" y2="570" stroke="#2f9e44" stroke-width="3" opacity="0.35"/>
<text x="400.0" y="556.0" font-size="13" fill="#495057" text-anchor="start" font-weight="normal">полоска из 5 дырок — D32, SDA шины 1</text>
<line x1="400" y1="640" x2="760" y2="640" stroke="#868e96" stroke-width="3" opacity="0.35"/>
<text x="400.0" y="626.0" font-size="13" fill="#495057" text-anchor="start" font-weight="normal">полоска из 5 дырок — D33, SCL шины 1</text>
<rect x="40" y="170" width="200" height="500" rx="12" fill="#1f3a5f"/>
<text x="140.0" y="205.0" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">ESP32</text>
<text x="140.0" y="228.0" font-size="14" fill="#d0ebff" text-anchor="middle" font-weight="normal">DevKit</text>
<rect x="222" y="201" width="18" height="18" rx="3" fill="#f1c232"/>
<text x="212.0" y="215.0" font-size="15" fill="#ffffff" text-anchor="end" font-weight="bold">3V3</text>
<path d="M 240.0 210.0 C 330.0 210.0 330.0 210.0 420.0 210.0" fill="none" stroke="#e03131" stroke-width="4" stroke-linecap="round"/>
<circle cx="420" cy="210" r="6" fill="#495057"/>
<rect x="222" y="271" width="18" height="18" rx="3" fill="#f1c232"/>
<text x="212.0" y="285.0" font-size="15" fill="#ffffff" text-anchor="end" font-weight="bold">GND</text>
<path d="M 240.0 280.0 C 330.0 280.0 330.0 280.0 420.0 280.0" fill="none" stroke="#212529" stroke-width="4" stroke-linecap="round"/>
<circle cx="420" cy="280" r="6" fill="#495057"/>
<rect x="222" y="381" width="18" height="18" rx="3" fill="#f1c232"/>
<text x="212.0" y="395.0" font-size="15" fill="#ffffff" text-anchor="end" font-weight="bold">D21</text>
<path d="M 240.0 390.0 C 330.0 390.0 330.0 390.0 420.0 390.0" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round"/>
<circle cx="420" cy="390" r="6" fill="#495057"/>
<rect x="222" y="451" width="18" height="18" rx="3" fill="#f1c232"/>
<text x="212.0" y="465.0" font-size="15" fill="#ffffff" text-anchor="end" font-weight="bold">D22</text>
<path d="M 240.0 460.0 C 330.0 460.0 330.0 460.0 420.0 460.0" fill="none" stroke="#868e96" stroke-width="4" stroke-linecap="round"/>
<circle cx="420" cy="460" r="6" fill="#495057"/>
<rect x="222" y="561" width="18" height="18" rx="3" fill="#f1c232"/>
<text x="212.0" y="575.0" font-size="15" fill="#ffffff" text-anchor="end" font-weight="bold">D32</text>
<path d="M 240.0 570.0 C 330.0 570.0 330.0 570.0 420.0 570.0" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round"/>
<circle cx="420" cy="570" r="6" fill="#495057"/>
<rect x="222" y="631" width="18" height="18" rx="3" fill="#f1c232"/>
<text x="212.0" y="645.0" font-size="15" fill="#ffffff" text-anchor="end" font-weight="bold">D33</text>
<path d="M 240.0 640.0 C 330.0 640.0 330.0 640.0 420.0 640.0" fill="none" stroke="#868e96" stroke-width="4" stroke-linecap="round"/>
<circle cx="420" cy="640" r="6" fill="#495057"/>
<text x="140.0" y="700.0" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">D21, D22, 3V3 и GND — справа на плате,</text>
<text x="140.0" y="718.0" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">D32 и D33 — слева.</text>
<text x="140.0" y="736.0" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">Сюда — короткие мама-папа 10–30 см</text>
<text x="140.0" y="754.0" font-size="13" fill="#495057" text-anchor="middle" font-weight="normal">VIN — только в запасном варианте</text>
<rect x="930" y="165" width="310" height="170" rx="12" fill="#1c6dd0"/>
<text x="1085.0" y="193.0" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">П — плечо</text>
<text x="1085.0" y="215.0" font-size="13" fill="#d0ebff" text-anchor="middle" font-weight="normal">шина 0, адрес 0x68</text>
<rect x="921" y="233" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="244.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">VCC</text>
<path d="M 921.0 239.0 C 740.5 239.0 740.5 210.0 560.0 210.0" fill="none" stroke="#e03131" stroke-width="3" stroke-linecap="round"/>
<circle cx="560" cy="210" r="6" fill="#495057"/>
<rect x="921" y="253" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="264.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">GND</text>
<path d="M 921.0 259.0 C 740.5 259.0 740.5 280.0 560.0 280.0" fill="none" stroke="#212529" stroke-width="3" stroke-linecap="round"/>
<circle cx="560" cy="280" r="6" fill="#495057"/>
<rect x="921" y="273" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="284.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">SCL</text>
<path d="M 921.0 279.0 C 740.5 279.0 740.5 460.0 560.0 460.0" fill="none" stroke="#868e96" stroke-width="3" stroke-linecap="round"/>
<circle cx="560" cy="460" r="6" fill="#495057"/>
<rect x="921" y="293" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="304.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">SDA</text>
<path d="M 921.0 299.0 C 740.5 299.0 740.5 390.0 560.0 390.0" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linecap="round"/>
<circle cx="560" cy="390" r="6" fill="#495057"/>
<rect x="921" y="313" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="324.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">AD0</text>
<path d="M 921.0 319.0 C 760.5 319.0 760.5 280.0 600.0 280.0" fill="none" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/>
<circle cx="600" cy="280" r="6" fill="#495057"/>
<text x="1230.0" y="325.0" font-size="13" fill="#ffd8a8" text-anchor="end" font-weight="bold">AD0 → «−»: адрес 0x68</text>
<rect x="930" y="370" width="310" height="170" rx="12" fill="#1c6dd0"/>
<text x="1085.0" y="398.0" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">ПР — предплечье</text>
<text x="1085.0" y="420.0" font-size="13" fill="#d0ebff" text-anchor="middle" font-weight="normal">шина 0, адрес 0x69</text>
<rect x="921" y="438" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="449.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">VCC</text>
<path d="M 921.0 444.0 C 780.5 444.0 780.5 210.0 640.0 210.0" fill="none" stroke="#e03131" stroke-width="3" stroke-linecap="round"/>
<circle cx="640" cy="210" r="6" fill="#495057"/>
<rect x="921" y="458" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="469.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">GND</text>
<path d="M 921.0 464.0 C 780.5 464.0 780.5 280.0 640.0 280.0" fill="none" stroke="#212529" stroke-width="3" stroke-linecap="round"/>
<circle cx="640" cy="280" r="6" fill="#495057"/>
<rect x="921" y="478" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="489.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">SCL</text>
<path d="M 921.0 484.0 C 780.5 484.0 780.5 460.0 640.0 460.0" fill="none" stroke="#868e96" stroke-width="3" stroke-linecap="round"/>
<circle cx="640" cy="460" r="6" fill="#495057"/>
<rect x="921" y="498" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="509.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">SDA</text>
<path d="M 921.0 504.0 C 780.5 504.0 780.5 390.0 640.0 390.0" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linecap="round"/>
<circle cx="640" cy="390" r="6" fill="#495057"/>
<rect x="921" y="518" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="529.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">AD0</text>
<path d="M 921.0 524.0 C 800.5 524.0 800.5 210.0 680.0 210.0" fill="none" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/>
<circle cx="680" cy="210" r="6" fill="#495057"/>
<text x="1230.0" y="530.0" font-size="13" fill="#ffd8a8" text-anchor="end" font-weight="bold">AD0 → «+»: адрес 0x69</text>
<rect x="930" y="575" width="310" height="170" rx="12" fill="#1c6dd0"/>
<text x="1085.0" y="603.0" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Г — грудь</text>
<text x="1085.0" y="625.0" font-size="13" fill="#d0ebff" text-anchor="middle" font-weight="normal">шина 1, адрес 0x68</text>
<rect x="921" y="643" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="654.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">VCC</text>
<path d="M 921.0 649.0 C 818.0 649.0 818.0 210.0 715.0 210.0" fill="none" stroke="#e03131" stroke-width="3" stroke-linecap="round"/>
<circle cx="715" cy="210" r="6" fill="#495057"/>
<rect x="921" y="663" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="674.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">GND</text>
<path d="M 921.0 669.0 C 818.0 669.0 818.0 280.0 715.0 280.0" fill="none" stroke="#212529" stroke-width="3" stroke-linecap="round"/>
<circle cx="715" cy="280" r="6" fill="#495057"/>
<rect x="921" y="683" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="694.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">SCL</text>
<path d="M 921.0 689.0 C 818.0 689.0 818.0 640.0 715.0 640.0" fill="none" stroke="#868e96" stroke-width="3" stroke-linecap="round"/>
<circle cx="715" cy="640" r="6" fill="#495057"/>
<rect x="921" y="703" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="714.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">SDA</text>
<path d="M 921.0 709.0 C 818.0 709.0 818.0 570.0 715.0 570.0" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linecap="round"/>
<circle cx="715" cy="570" r="6" fill="#495057"/>
<rect x="921" y="723" width="18" height="12" rx="2" fill="#f1c232"/>
<text x="946.0" y="734.0" font-size="13" fill="#ffffff" text-anchor="start" font-weight="bold">AD0</text>
<path d="M 921.0 729.0 C 835.5 729.0 835.5 280.0 750.0 280.0" fill="none" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/>
<circle cx="750" cy="280" r="6" fill="#495057"/>
<text x="1230.0" y="735.0" font-size="13" fill="#ffd8a8" text-anchor="end" font-weight="bold">AD0 → «−»: адрес 0x68</text>
<text x="40.0" y="790.0" font-size="18" fill="#212529" text-anchor="start" font-weight="bold">Как собрать</text>
<text x="40.0" y="820.0" font-size="14" fill="#212529" text-anchor="start" font-weight="normal">1. Кабель к датчику — полоска из 5 проводов мама-папа, не разрывать: четыре на VCC, GND, SCL, SDA подряд, пятый на AD0. Две полоски по 40 см — 80 см.</text>
<text x="40.0" y="846.0" font-size="14" fill="#212529" text-anchor="start" font-weight="normal">2. Цвет одной жилы везде один: красная — VCC, чёрная — GND, зелёная — SDA, белая или серая — SCL. Флажок из скотча на обоих концах: П, ПР, Г.</text>
<text x="40.0" y="872.0" font-size="14" fill="#212529" text-anchor="start" font-weight="normal">3. Всё воткнуть при отключённом USB. Потом USB, монитор порта 460800, scan: шина 0 — 0x68 0x69, шина 1 — 0x68.</text>
<text x="40.0" y="898.0" font-size="14" fill="#212529" text-anchor="start" font-weight="normal">4. Пошевелить каждый кабель, глядя в монитор: строки «перезапускаю шину» — плохой стык. Перемотать изолентой, проверить снова.</text>
<text x="40.0" y="924.0" font-size="14" fill="#c92a2a" text-anchor="start" font-weight="bold">Нет макетной платы — только два датчика: «П» на 3V3, GND справа, D21, D22; «Г» на VIN, GND слева, D32, D33.</text>
<text x="40.0" y="950.0" font-size="14" fill="#c92a2a" text-anchor="start" font-weight="normal">AD0 у обоих свободен. Перед подключением D32 и D33 замерить у «Г», запитанного от VIN, SDA и SCL относительно GND: около 3,3 В, не 5.</text>
</svg>
