; Прошивка стенда NeuroMove — способ А: ESP32 + MPU-6050 на проводах, USB к ноутбуку.
; Сборка и прошивка — README.md в этой папке. Та же папка открывается в Arduino IDE:
; скетч — NeuroMoveStand/NeuroMoveStand.ino.

[platformio]
src_dir = NeuroMoveStand
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 460800
; CORE_DEBUG_LEVEL=0 — ядро не пишет в порт свои строки «[E][Wire.cpp…]», когда датчик не ответил:
; приложение посчитало бы их испорченными строками. Arduino IDE по умолчанию делает так же («Core Debug Level: None»)
build_flags = -Wall -Wextra -DCORE_DEBUG_LEVEL=0

; ESP32-S3 N16R8 — если стенд соберут на S3 (выбор Малики 29 сентября, не куплена). USB-C «COM» — порт для ноутбука.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = ${env.build_flags} -DNM_BOARD_ESP32S3

; То же, но поток через второй USB-C «USB» (родной USB у S3) — если на плате один разъём
[env:esp32s3_usb]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = ${env.build_flags} -DNM_BOARD_ESP32S3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; Классический ESP32 DevKit — плата стенда, куплена 9 октября: ESP32-WROOM-32, CH340C, USB Type-C
; (прототип.md, раздел 2). Сборка по умолчанию — `pio run`
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DNM_BOARD_ESP32

; Проверка на ядре Arduino-ESP32 3.x — его ставит Arduino IDE по умолчанию (сборка pioarduino).
; 2 октября 2026: собирается на 3.3.12 без предупреждений. Скачивает ~1 ГБ инструментов
[env:esp32s3_arduino3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DNM_BOARD_ESP32S3

[env:esp32dev_arduino3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
build_flags = ${env.build_flags} -DNM_BOARD_ESP32
